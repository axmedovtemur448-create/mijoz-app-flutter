name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create native platform folders
        run: flutter create . --platforms=android --org com.sizningkompaniya --project-name mijoz_app

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: mijoz-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
